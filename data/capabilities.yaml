# Capabilities catalog spec
#
# Goal: auto-generate a PM-style capabilities list (activity name, description,
# in/out arguments) per library, from a parseable source each library commits to.
#
# This file defines the convention + per-library compliance status.
# The catalog generator itself (rendering the PM-style list from doc.json)
# is not yet implemented.

convention:
  plus:
    description: >
      C# coded activities (src/plus/**/Activities/*.cs). Source of truth is
      XML doc comments on the class + public InArgument<T>/OutArgument<T>
      properties.
    required:
      - "/// <summary>...</summary> on the activity class"
      - "/// <summary>...</summary> on each InArgument<T>/OutArgument<T> property"
      - "[Category(\"CPMForge.<Lib>\")] attribute on the class"
    generator: not implemented   # no henri equivalent for plus/C# yet

  open:
    description: >
      UiPath Studio workflows (src/open/**/*.xaml) exposed as library
      activities. Source of truth is src/open/docs/<Name>.doc.json,
      produced by `henri uips libdoc -p src/open/project.json`
      (cprima-forge/cpmf-uips-cli). Statically parses XAML Annotation
      text + argument comments — no Studio session required.
    required:
      - "src/open/docs/*.doc.json — generated, not hand-authored"
    generator: tools/libdoc-run/run.py   # wraps `henri uips libdoc` across all repos in data/libraries.yaml

libraries:
  - name: cpmf-uipsl-sap
    edition: open
    source_present: true      # src/open/docs/CPMForge.SAP.Open.doc.json (+ legacy root docs/ copy)
    parser_wired: false

  - name: cpmf-uipsl-logging
    edition: open
    source_present: true      # src/open/docs/CPMForge.Logging.Open.doc.json
    parser_wired: false

  - name: cpmf-uipsl-sftp
    edition: plus
    source_present: unknown   # not yet audited for XML doc comment coverage
    parser_wired: false

  - name: cpmf-uipsl-m365
    edition: open+plus
    source_present: true      # open: src/open/docs/CPMForge.M365.Open.doc.json; plus: unknown
    parser_wired: false

  - name: cpmf-uipsl-rpachallenge
    edition: open
    source_present: true      # src/open/docs/cpmf-uipsl-rpachallenge.doc.json (project name unset in project.json)
    parser_wired: false

  - name: cpmf-uipsl-config
    edition: plus
    source_present: unknown
    parser_wired: false

  - name: cpmf-uipsl-tpl
    edition: plus
    source_present: unknown
    parser_wired: false
