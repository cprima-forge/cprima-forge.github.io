<!DOCTYPE html>
<html lang="en" data-fa-kit-code="5df958b77d">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products — cprima-forge</title>
<link rel="stylesheet" href="https://ka-p.webawesome.com/kit/9d55e66325f84b80/webawesome@3.12.0/styles/themes/default.css">
<link rel="stylesheet" href="https://ka-p.webawesome.com/kit/9d55e66325f84b80/webawesome@3.12.0/styles/utilities.css">
<link rel="stylesheet" href="https://ka-p.webawesome.com/kit/9d55e66325f84b80/webawesome@3.12.0/styles/native.css">
<script type="module" src="https://ka-p.webawesome.com/kit/9d55e66325f84b80/webawesome@3.12.0/webawesome.loader.js"></script>
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<main>
  <h1>Products</h1>
  <p class="muted">This page intentionally left blank.</p>
</main>

<!--
  CATALOG RENDERING IS DISABLED, DELIBERATELY AND TEMPORARILY.

  The script below is unchanged and inert: `type="text/plain"` stops the browser
  executing it, which preserves the source exactly rather than commenting it out
  and hoping no `--` inside the JavaScript breaks the comment. Restore it by
  changing the type back to `module`, and put back the heading paragraph above.

  Why: no HTML presentation of the catalog while nobody is watching the service.
  Prices, tiers and product names are commercial statements, and a stale or
  half-migrated one making claims unattended is worse than a page that says
  nothing.

  /api/v1/catalog.json IS STILL SERVED, on purpose. It is the published contract
  that keygen_sync.py reads to reconcile Keygen, so removing it would break the
  tooling rather than protect anything — and it is inert data that no stranger
  can act on. Only the human-facing presentation is withdrawn.
-->
<script type="text/plain" data-disabled="catalog-render">
// The page renders data it fetches; it never hardcodes a product, a price or a
// tier. Adding an offer is a catalog edit and a rebuild, never an HTML edit —
// which is the whole reason the catalog is the source of truth.
// A price is either decided — including decided as zero — or explicitly not
// decided. These must never render alike: a placeholder zero once made "not yet
// priced" indistinguishable from "free" in the contract itself.
const money = p => {
  if (typeof p.amount === "number") {
    return p.amount === 0
      ? "Free"
      : new Intl.NumberFormat(undefined, { style: "currency", currency: p.currency }).format(p.amount);
  }
  if (p.status === "on-request") return "Price on request";   // decided: negotiated
  if (p.status === "undecided") return "Not yet priced";      // not decided at all
  return "—";
};

// `duration` is a licensing term and optional: a printed book has none. An
// offer without one gets no term text rather than a fabricated default.
const DURATION = { perpetual: "one-off", annual: "per year", monthly: "per month" };
const term = d => (!d ? null : DURATION[d] ?? `every ${d.replace(/d$/, " days")}`);

fetch("/api/v1/catalog.json")
  .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
  .then(cat => {
    const out = document.getElementById("out");
    out.textContent = "";
    for (const p of cat.products) {
      const art = document.createElement("article");
      art.className = "card";
      const h = document.createElement("h2");
      h.textContent = p.name;
      const s = document.createElement("p");
      s.className = "muted";
      s.textContent = p.summary;
      art.append(h, s);

      for (const o of p.offers) {
        // A planned or retired offer is real catalog data, but showing it as
        // purchasable would be a lie, so it is labelled rather than hidden.
        const d = document.createElement("div");
        d.className = "offer";
        const row = document.createElement("div");
        row.className = "row";

        const n = document.createElement("span");
        n.className = "name";
        n.textContent = o.name;
        const pr = document.createElement("span");
        pr.className = "price";
        const t = term(o.duration);
        pr.textContent = money(o.price) + (t ? " · " + t : "");
        row.append(n, pr);

        if (o.status && o.status !== "active") {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = o.status;
          row.append(tag);
        }
        d.append(row);

        if (o.highlights?.length) {
          const ul = document.createElement("ul");
          for (const hl of o.highlights) {
            const li = document.createElement("li");
            li.textContent = hl;
            ul.append(li);
          }
          d.append(ul);
        }

        const meta = document.createElement("p");
        meta.className = "meta";
        meta.textContent = [o.slug ?? o.sku, o.seat_model?.replace(/-/g, " ")].filter(Boolean).join(" · ");
        d.append(meta);

        // Only an active offer with an open self-service or manual channel can
        // actually be requested today.
        if (o.status === "active" && o.price.amount === 0) {   // amount, never status
          const a = document.createElement("a");
          a.href = "/licence/?sku=" + encodeURIComponent(o.sku);
          a.textContent = "Request a key →";
          d.append(a);
        }
        art.append(d);
      }
      out.append(art);
    }
  })
  .catch(e => {
    const out = document.getElementById("out");
    out.className = "error";
    out.textContent = "Could not load the catalog: " + e.message;
  });
</script>
</body>
</html>
